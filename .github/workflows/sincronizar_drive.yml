name: Sincronização de Partituras e MP3

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-drive:
    runs-on: ubuntu-24.04

    steps:
    - name: ⤵️ Descarregar código do repositório
      uses: actions/checkout@v4

    - name: 🛠️ Instalar o Rclone Nativo
      run: |
        sudo apt-get update
        sudo apt-get install -y rclone

    - name: 📝 Configurar Credenciais em Ficheiro
      run: |
        echo '${{ secrets.GDRIVE_CREDENTIALS }}' > gdrive_key.json

    - name: 📁 Criar estrutura de destino
      run: mkdir -p repositorio_site

    - name: 🔄 Descarregar ficheiros do Google Drive
      run: |
        rclone copyto :drive: ./repositorio_site \
          --drive-service-account-file="gdrive_key.json" \
          --drive-root-folder-id="${{ secrets.GDRIVE_FOLDER_ID }}" \
          --drive-shared-with-me \
          --verbose

    - name: 🚀 Eliminar chave temporária e atualizar o GitHub
      run: |
        rm -f gdrive_key.json
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização de repertório: PDFs e MP3 atualizados" && git push origin main)
